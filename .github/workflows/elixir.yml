name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    name: Build and test
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@61e01a43a562a89bfc54c7f9a378ff67b03e4a21 # v1.16.0
      with:
        elixir-version: '1.15.2' # [Required] Define the Elixir version
        otp-version: '26.0'      # [Required] Define the Erlang/OTP version
    - name: Restore dependencies cache
      uses: actions/cache@v3
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for PostgreSQL to be ready..."
          sleep 1
        done
    - name: Build code and create db and migrations
      run: |
        mix ecto.create
        mix ecto.migrate
      env:
        MIX_ENV: test
    - name: Run tests
      run: mix test
    - name: Run load tests
      run: mix load.process 10 10
      env:
        MIX_ENV: perf
    # Exercises the production consumer path end to end: enqueue through
    # CommandApi, then acquire a lease and drain with a real InstanceProcessor.
    # `load.process` starts no processor, so without this step nothing in CI
    # runs the queue's dispatch, claim and lease code outside the test sandbox.
    # 200 commands takes a few seconds; the task drops and recreates the perf
    # database itself.
    - name: Run drain load test
      run: mix load.drain 200
      env:
        MIX_ENV: perf
